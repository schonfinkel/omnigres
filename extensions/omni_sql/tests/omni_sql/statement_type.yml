$schema: "https://raw.githubusercontent.com/omnigres/omnigres/master/pg_yregress/schema.json"
instance:
  init:
  - create extension omni_sql cascade

tests:

- query: select omni_sql.statement_type(null)
  results:
  - statement_type: null

- query: select omni_sql.statement_type(''::omni_sql.statement)
  results:
  - statement_type: null

- query: select omni_sql.statement_type('select ; create table a ()'::omni_sql.statement)
  results:
  - statement_type: MultiStmt

# Incomplete list below. FIXME

- query: select omni_sql.statement_type('select'::omni_sql.statement)
  results:
  - statement_type: SelectStmt

- query: select omni_sql.statement_type('update tab set col = 1'::omni_sql.statement)
  results:
  - statement_type: UpdateStmt

- query: select omni_sql.statement_type('cluster t'::omni_sql.statement)
  results:
  - statement_type: ClusterStmt

# The input is picked at run time, so majors before 19 never parse it
- query: |
    select omni_sql.statement_type((case when current_setting('server_version_num')::int >= 190000
                                         then 'repack t' end)::omni_sql.statement)
           is not distinct from
           case when current_setting('server_version_num')::int >= 190000
                then 'RepackStmt' end::omni_sql.statement_type as ok
  results:
  - ok: true
